name: shared-runner-setup

description: Build runner setup

inputs:
  needs_cosign:
    description: "Whether to install cosign, otherwise 'false'."
    required: false
    default: "false"
  needs_slsa_oras:
    description: "Whether to install slsa-verifier and ORAS, otherwise 'false'."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Optimize build times
      shell: bash
      run: |
        echo 'set man-db/auto-update false' | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
        sudo rm -f /var/lib/man-db/auto-update
        echo 'update_initramfs=no' | sudo tee /etc/initramfs-tools/update-initramfs.conf > /dev/null

    - name: Drop Ubuntu HTTP mirrors and chrome repo
      shell: bash
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome*
        sudo sed -i '/^http:\/\//d' /etc/apt/apt-mirrors.txt
        sudo apt-get update

    - name: Install cosign
      uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
      if: ${{ inputs.needs_cosign == 'true' }}
      with:
        cosign-release: "v2.6.0"

    - name: Install oras
      if: ${{ inputs.needs_slsa_oras == 'true' }}
      uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      with:
        # renovate: datasource=github-releases depName=oras-project/oras
        version: 1.3.6

    - name: Install slsa-verifier
      if: ${{ inputs.needs_slsa_oras == 'true' }}
      uses: slsa-framework/actions/install/verifier@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
      with:
        # renovate: datasource=github-releases depName=slsa-framework/verifier
        version: v0.1.1
