<busconfig>
  <policy user="root">
    <allow own="dev.secureblue.PrivCmd0" />
  </policy>

  <policy context="default">
    <allow send_destination="dev.secureblue.PrivCmd0" send_path="/dev/secureblue/PrivCmd0" />
  </policy>
</busconfig>
