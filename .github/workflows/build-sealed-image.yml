name: build-sealed-image

permissions: {}

env:
  # For CoreOS (which has version "next"), use systemd-boot from F44.
  IMAGE_VERSION: ${{ inputs.image_version == 'next' && '44' || inputs.image_version }}

on:
  workflow_call:
    inputs:
      image:
        description: "Image name (e.g. silverblue-main-hardened)."
        type: string
        required: true
      base_tag:
        description: "The tag of the base image (e.g. latest)."
        type: string
        required: true
      base_digest:
        description: "The digest of the base image to seal (e.g. sha256:abc123)."
        type: string
        required: true
      image_version:
        description: "The Fedora image version used for getting the systemd-boot image, e.g. 44."
        type: string
        required: true
    secrets:
      COSIGN_KEY:
        required: true
      UKI_DB_KEY:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.image }}
  cancel-in-progress: true

jobs:
  uki-sign-sealed-image:
    name: "Build and UKI-sign sealed image"
    environment: UKIBuild
    runs-on: "ubuntu-26.04"
    outputs:
      IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read # Needed to pull the repo for the build
      packages: write # Needed to publish images
    steps:
      - name: Enable egress auditing
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            # ubuntu packages
            _https._tcp.archive.ubuntu.com:443
            archive.ubuntu.com:443
            _https._tcp.security.ubuntu.com:443
            security.ubuntu.com:443
            _https._tcp.packages.microsoft.com:443
            packages.microsoft.com:443
            _https._tcp.motd.ubuntu.com:443
            motd.ubuntu.com:443
            _https._tcp.esm.ubuntu.com:443
            esm.ubuntu.com:443

            # cosign installation
            github.com:443

            # slsa-verifier installation
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443

            # pulling base images
            quay.io:443
            cdn01.quay.io:443

            # Trivalent SLSA
            release-assets.githubusercontent.com:443

            # pulling secureblue images
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

            # bluebuild schema validation
            schema.blue-build.org:443

            # Install packages from our COPR repos
            copr.fedorainfracloud.org:443
            download.copr.fedorainfracloud.org:443

            # Docker installation
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            download.docker.com:443

            # Dangerzone installation
            packages.freedom.press:443

            # Negativo packages installation
            negativo17.org:443

            # Trivalent installation
            repo.secureblue.dev:443

            # Fedora archive
            fedoraproject-updates-archive.fedoraproject.org:443

            # Pull various cosign pubkeys
            raw.githubusercontent.com:443

            # Install brew
            formulae.brew.sh:443

            # Install the tailscale repo
            pkgs.tailscale.com:443

            # Install nvidia container toolkit repo
            nvidia.github.io:443

            # Pull gpg keys
            keyserver.ubuntu.com:443

            # Fedora mirrors
            # https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-43&arch=x86_64&protocol=https
            abqix.mm.fcix.net:443
            cfhcable.mm.fcix.net:443
            codingflyboy.mm.fcix.net:443
            cofractal-ewr.mm.fcix.net:443
            cofractal-sea.mm.fcix.net:443
            coresite-atl.mm.fcix.net:443
            coresite.mm.fcix.net:443
            d2lzkl7pfhq30w.cloudfront.net:443
            dfw.mirror.rackspace.com:443
            dl.fedoraproject.org:443
            download-cc-rdu01.fedoraproject.org:443
            download-ib01.fedoraproject.org:443
            fdix-ind.mm.fcix.net:443
            fedora-mirror-atl.gigsouth.com:443
            fedora.mirror.constant.com:443
            forksystems.mm.fcix.net:443
            ftp2.osuosl.org:443
            ftp-chi.osuosl.org:443
            ftp-nyc.osuosl.org:443
            ftp-osl.osuosl.org:443
            gigsouth.mm.fcix.net:443
            iad.mirror.rackspace.com:443
            insect.mm.fcix.net:443
            irltoolkit.mm.fcix.net:443
            ix-denver.mm.fcix.net:443
            lesnet.mm.fcix.net:443
            lolhost.mm.fcix.net:443
            mirror.cpsc.ucalgary.ca:443
            mirror.csclub.uwaterloo.ca:443
            mirror.cs.princeton.edu:443
            mirror.cs.siue.edu:443
            mirror.dst.ca:443
            mirror.fcix.net:443
            mirror.lstn.net:443
            mirror.math.princeton.edu:443
            mirror.servaxnet.com:443
            mirrors.fedoraproject.org:443
            mirrors.mit.edu:443
            mirrors.xmission.com:443
            mirror.us.mirhosting.net:443
            mirror.web-ster.com:443
            mirror.xenyth.net:443
            muug.ca:443
            na.edge.kernel.org:443
            nnenix.mm.fcix.net:443
            nocix.mm.fcix.net:443
            nullroute.mm.fcix.net:443
            ohioix.mm.fcix.net:443
            opencolo.mm.fcix.net:443
            ord.mirror.rackspace.com:443
            paducahix.mm.fcix.net:443
            paducahix.mm.fcix.net:443
            pubmirror1.math.uh.edu:443
            pubmirror2.math.uh.edu:443
            pubmirror3.math.uh.edu:443
            ryamer.mm.fcix.net:443
            sjc.mirror.rackspace.com:443
            solidrock.mm.fcix.net:443
            southfront.mm.fcix.net:443
            stix.mm.fcix.net:443
            us.mirrors.cicku.me:443
            veronanetworks.mm.fcix.net:443
            volico.mm.fcix.net:443
            yxeix.mm.fcix.net:443
            yycix.mm.fcix.net:443
            ziply.mm.fcix.net:443

      - name: "Free disk space"
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "64G"

      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up runner"
        uses: ./.github/workflows/shared-runner-setup
        with:
          needs_cosign: true
          needs_slsa_crane: true

      - name: "Log in to registry"
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: "ghcr.io/${{ github.repository_owner }}"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Get base image digests"
        id: base_image_digests
        shell: bash
        run: |
          SYSTEMD_BOOT_DIGEST=$(crane digest "ghcr.io/${GITHUB_REPOSITORY_OWNER}/systemd-boot:${IMAGE_VERSION}")
          echo "SYSTEMD_BOOT_DIGEST=${SYSTEMD_BOOT_DIGEST}" >> "${GITHUB_OUTPUT}"
          UKI_ADDONS_DIGEST=$(crane digest "ghcr.io/${GITHUB_REPOSITORY_OWNER}/uki-addons:latest")
          echo "UKI_ADDONS_DIGEST=${UKI_ADDONS_DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: "Verify base images"
        shell: bash
        env:
          REPO: "ghcr.io/${{ github.repository_owner }}"
          BASE_IMAGE: ${{ inputs.image }}
          BASE_IMAGE_DIGEST: ${{ inputs.base_digest }}
          SYSTEMD_BOOT_DIGEST: ${{ steps.base_image_digests.outputs.SYSTEMD_BOOT_DIGEST }}
          UKI_ADDONS_DIGEST: ${{ steps.base_image_digests.outputs.UKI_ADDONS_DIGEST }}
        run: |
          slsa-verifier verify-image --source-uri "github.com/${GITHUB_REPOSITORY}" "${REPO}/${BASE_IMAGE}@${BASE_IMAGE_DIGEST}"
          cosign verify --key ./cosign.pub "${REPO}/${BASE_IMAGE}@${BASE_IMAGE_DIGEST}"
          slsa-verifier verify-image --source-uri "github.com/${GITHUB_REPOSITORY}" "${REPO}/systemd-boot@${SYSTEMD_BOOT_DIGEST}"
          cosign verify --key ./cosign.pub "${REPO}/systemd-boot@${SYSTEMD_BOOT_DIGEST}"
          slsa-verifier verify-image --source-uri "github.com/${GITHUB_REPOSITORY}" "${REPO}/uki-addons@${UKI_ADDONS_DIGEST}"
          cosign verify --key ./cosign.pub "${REPO}/uki-addons@${UKI_ADDONS_DIGEST}"

      - name: "Generate tags"
        id: tags
        run: |
          set -euxo pipefail
          date="$(date '+%Y%m%d')"
          tags="${BASE_TAG}-uki"
          if [[ "$BASE_TAG" == "latest" ]]; then
            tags+=" uki ${date}-${IMAGE_VERSION}-uki ${date}-uki ${IMAGE_VERSION}-uki"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
        env:
          BASE_TAG: ${{ inputs.base_tag }}

      - name: "Get secure boot signing key"
        run: |
          mkdir -p /tmp/keys
          printenv UKI_DB_KEY > /tmp/keys/key
          cp uki/keys/db/db.pem /tmp/keys/crt
        env:
          UKI_DB_KEY: ${{ secrets.UKI_DB_KEY }}

      - name: "Build kernel container"
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ inputs.image }}-kernel
          tags: ${{ inputs.base_tag }}-uki
          containerfiles: uki/Containerfile.kernel
          oci: true
          build-args: |
            BASE=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ inputs.base_digest }}

      - name: "Build base container"
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ inputs.image }}-base
          tags: ${{ inputs.base_tag }}-uki
          containerfiles: uki/Containerfile.base
          oci: true
          build-args: |
            BASE=ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}@${{ inputs.base_digest }}
            SYSTEMDBOOT=ghcr.io/${{ github.repository_owner }}/systemd-boot:${{ env.IMAGE_VERSION }}
            UKIADDONS=ghcr.io/${{ github.repository_owner }}/uki-addons:latest
          extra-args: |
            --skip-unused-stages=false
            --security-opt=label=disable
            --volume /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}:/run/src

      - name: "Build final container"
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ${{ inputs.image }}
          tags: ${{ steps.tags.outputs.tags }}
          containerfiles: uki/Containerfile.uki
          oci: true
          build-args: |
            BASE=${{ inputs.image }}-base:${{ inputs.base_tag }}-uki
            KERNEL=${{ inputs.image }}-kernel:${{ inputs.base_tag }}-uki
            RELEASE=${{ env.IMAGE_VERSION }}
          extra-args: |
            --security-opt=label=disable
            --volume /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}:/run/src
            --secret id=secureboot_key,src=/tmp/keys/key
            --secret id=secureboot_crt,src=/tmp/keys/crt

      - name: "Clean up secure boot signing key"
        if: always()
        run: rm -vrf /tmp/keys

      - name: "Push to registry"
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        id: push
        with:
          image: ${{ inputs.image }}
          tags: ${{ steps.tags.outputs.tags }}
          registry: "ghcr.io/${{ github.repository_owner }}"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  cosign-sealed-image:
    needs: uki-sign-sealed-image
    name: "Cosign sealed image"
    environment: Build
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read # Needed to pull the repo for the build
      packages: write # Needed to sign images
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up runner"
        uses: ./.github/workflows/shared-runner-setup
        with:
          needs_cosign: true

      - name: "Log in to registry"
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: "ghcr.io/${{ github.repository_owner }}"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Sign container image"
        run: |
          cosign sign -y --key env://COSIGN_KEY "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE}@${DIGEST}"
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ needs.uki-sign-sealed-image.outputs.IMAGE_DIGEST }}

  provenance:
    needs: uki-sign-sealed-image
    permissions:
      actions: read # for detecting the Github Actions environment.
      id-token: write # for creating OIDC tokens for signing.
      packages: write # for uploading attestations.
    # Currently this must be referenced by tag, not by hash:
    # https://github.com/slsa-framework/slsa-github-generator?tab=readme-ov-file#referencing-slsa-builders-and-generators
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      image: "ghcr.io/${{ github.repository_owner }}/${{ inputs.image }}"
      digest: ${{ needs.uki-sign-sealed-image.outputs.IMAGE_DIGEST }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
