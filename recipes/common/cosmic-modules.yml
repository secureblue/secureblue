modules:
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    install:
      install-weak-deps: false
      packages:
        - NetworkManager-tui
        - NetworkManager-openvpn
    remove:
      packages:
        - cosmic-store
        - cosmic-player
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
  - type: systemd
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    system:
      enabled:
        - cosmic-greeter
  - type: files
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    files:
      - source: system/cosmic
        destination: /
