modules:
  - type: script
    source: ghcr.io/blue-build/modules@sha256:45471c9764ad88e10414ef8580db0a6984508443b0b6463d301d5b13f9092f2e
    scripts:
      - removeunusedrepos.sh
      - httpsmirrors.sh
      - unprotectsudo.sh
      # comment/uncomment the line below to disable/enable kernel pinning
      # - installpinnedkernel.sh
      # remove line below once rpm-ostree has been updated to fixed version on all images
      - check-rpm-ostree-version.sh

  - type: files
    source: ghcr.io/blue-build/modules@sha256:45471c9764ad88e10414ef8580db0a6984508443b0b6463d301d5b13f9092f2e
    files:
      - source: system/usr
        destination: /usr
      - source: system/etc
        destination: /etc

  - from-file: common/common-packages.yml

  - from-file: common/common-scripts.yml

  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:45471c9764ad88e10414ef8580db0a6984508443b0b6463d301d5b13f9092f2e
    validate: true
    include:
      - common

  - type: script
    source: ghcr.io/blue-build/modules@sha256:45471c9764ad88e10414ef8580db0a6984508443b0b6463d301d5b13f9092f2e
    scripts:
      - installandsignkernel.sh
    secrets:
      - type: env
        name: KERNEL_PRIVKEY
        mount:
          type: file
          destination: /tmp/certs/private_key.priv

  - type: secureblue-signing
    source: local
