name: build-secureblue
permissions: {}
on:
  workflow_call:
    inputs:
      recipe:
        type: string
        required: true
      rechunk:
        type: boolean
        required: false
        default: false
    secrets:
      SIGNING_SECRET:
        required: true
      KERNEL_PRIVKEY:
        required: true
    outputs:
      IMAGE_DIGEST:
        value: ${{ jobs.bluebuild.outputs.IMAGE_DIGEST }}
      IMAGE_NAME:
        value: ${{ jobs.bluebuild.outputs.IMAGE_NAME }}
      IMAGE_TAG:
        value: ${{ jobs.bluebuild.outputs.IMAGE_TAG }}
      IMAGE_VERSION:
        value: ${{ jobs.bluebuild.outputs.IMAGE_VERSION }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.recipe }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build secureblue
    runs-on: ubuntu-26.04
    environment: Build
    outputs:
      FULL_IMAGE_REF: ${{ steps.image_data.outputs.FULL_IMAGE_REF }}
      IMAGE_NAME: ${{ steps.image_data.outputs.IMAGE_NAME }}
      IMAGE_DIGEST: ${{ steps.image_manifest_metadata.outputs.IMAGE_DIGEST }}
      IMAGE_TAG: ${{ steps.image_data.outputs.IMAGE_TAG }}
      IMAGE_VERSION: ${{ steps.image_data.outputs.BASE_IMAGE_VERSION }}
    permissions:
      contents: read # Needed to pull the repo for the build
      packages: write # Needed to publish images
      id-token: write # Needed for token generation for signing
    steps:
      - name: Enable egress auditing
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            # ubuntu packages
            _https._tcp.archive.ubuntu.com:443
            archive.ubuntu.com:443
            _https._tcp.security.ubuntu.com:443
            security.ubuntu.com:443
            _https._tcp.packages.microsoft.com:443
            packages.microsoft.com:443
            _https._tcp.motd.ubuntu.com:443
            motd.ubuntu.com:443
            _https._tcp.esm.ubuntu.com:443
            esm.ubuntu.com:443

            # cosign installation
            github.com:443

            # slsa-verifier installation
            tuf-repo-cdn.sigstore.dev:443
            rekor.sigstore.dev:443

            # pulling base images
            quay.io:443
            cdn01.quay.io:443

            # Trivalent SLSA
            release-assets.githubusercontent.com:443

            # pulling secureblue images
            ghcr.io:443
            pkg-containers.githubusercontent.com:443

            # bluebuild schema validation
            schema.blue-build.org:443

            # Install packages from our COPR repos
            copr.fedorainfracloud.org:443
            download.copr.fedorainfracloud.org:443

            # Docker installation
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            auth.docker.io:443

            # Negativo packages installation
            negativo17.org:443

            # Trivalent installation
            repo.secureblue.dev:443

            # Fedora archive
            fedoraproject-updates-archive.fedoraproject.org:443

            # Pull various cosign pubkeys
            raw.githubusercontent.com:443

            # Install brew
            formulae.brew.sh:443

            # Install the tailscale repo
            pkgs.tailscale.com:443

            # Install nvidia container toolkit repo
            nvidia.github.io:443

            # Pull gpg keys
            keyserver.ubuntu.com:443

            # Fedora mirrors
            # https://mirrors.fedoraproject.org/mirrorlist?repo=fedora-43&arch=x86_64&protocol=https
            abqix.mm.fcix.net:443
            cfhcable.mm.fcix.net:443
            codingflyboy.mm.fcix.net:443
            cofractal-ewr.mm.fcix.net:443
            cofractal-sea.mm.fcix.net:443
            coresite-atl.mm.fcix.net:443
            coresite.mm.fcix.net:443
            d2lzkl7pfhq30w.cloudfront.net:443
            dfw.mirror.rackspace.com:443
            dl.fedoraproject.org:443
            download-cc-rdu01.fedoraproject.org:443
            download-ib01.fedoraproject.org:443
            fdix-ind.mm.fcix.net:443
            fedora-mirror-atl.gigsouth.com:443
            fedora.mirror.constant.com:443
            forksystems.mm.fcix.net:443
            ftp2.osuosl.org:443
            ftp-chi.osuosl.org:443
            ftp-nyc.osuosl.org:443
            ftp-osl.osuosl.org:443
            gigsouth.mm.fcix.net:443
            iad.mirror.rackspace.com:443
            insect.mm.fcix.net:443
            irltoolkit.mm.fcix.net:443
            ix-denver.mm.fcix.net:443
            lesnet.mm.fcix.net:443
            lolhost.mm.fcix.net:443
            mirror.cpsc.ucalgary.ca:443
            mirror.csclub.uwaterloo.ca:443
            mirror.cs.princeton.edu:443
            mirror.cs.siue.edu:443
            mirror.dst.ca:443
            mirror.fcix.net:443
            mirror.lstn.net:443
            mirror.math.princeton.edu:443
            mirror.servaxnet.com:443
            mirrors.fedoraproject.org:443
            mirrors.mit.edu:443
            mirrors.xmission.com:443
            mirror.us.mirhosting.net:443
            mirror.web-ster.com:443
            mirror.xenyth.net:443
            muug.ca:443
            na.edge.kernel.org:443
            nnenix.mm.fcix.net:443
            nocix.mm.fcix.net:443
            nullroute.mm.fcix.net:443
            ohioix.mm.fcix.net:443
            opencolo.mm.fcix.net:443
            ord.mirror.rackspace.com:443
            paducahix.mm.fcix.net:443
            paducahix.mm.fcix.net:443
            pubmirror1.math.uh.edu:443
            pubmirror2.math.uh.edu:443
            pubmirror3.math.uh.edu:443
            ryamer.mm.fcix.net:443
            sjc.mirror.rackspace.com:443
            solidrock.mm.fcix.net:443
            southfront.mm.fcix.net:443
            stix.mm.fcix.net:443
            us.mirrors.cicku.me:443
            veronanetworks.mm.fcix.net:443
            volico.mm.fcix.net:443
            yxeix.mm.fcix.net:443
            yycix.mm.fcix.net:443
            ziply.mm.fcix.net:443

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gather image data from recipe
        id: image_data
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_EVENT_NUMBER: ${{ github.event.number }}
          RECIPE: ${{ inputs.recipe }}
        run: |
          IMAGE_NAME=$(yq -r '."name"' "./recipes/${RECIPE}")
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "BASE_IMAGE=$(yq -r '."base-image"' "./recipes/${RECIPE}")" >> "${GITHUB_OUTPUT}"
          echo "BASE_IMAGE_VERSION=$(yq -r '."image-version"' "./recipes/${RECIPE}")" >> "${GITHUB_OUTPUT}"

          case "$GITHUB_REF" in
            refs/heads/"$DEFAULT_BRANCH") image_tag='latest' ;;
            refs/pull/*) image_tag="pr-${PR_EVENT_NUMBER}-44" ;;
            *) image_tag="br-${GITHUB_REF_NAME}-44" ;;
          esac
          echo "IMAGE_TAG=${image_tag}" >> "${GITHUB_OUTPUT}"
          FULL_IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${image_tag}"
          echo "FULL_IMAGE_REF=${FULL_IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Runner setup
        id: runner_setup
        uses: ./.github/workflows/shared-runner-setup
        with:
          needs_cosign: ${{ steps.image_data.outputs.IMAGE_NAME != 'securecore-main-hardened' && steps.image_data.outputs.IMAGE_NAME != 'iot-main-hardened' }}
          needs_slsa_crane: ${{ startsWith(steps.image_data.outputs.BASE_IMAGE, format('ghcr.io/{0}/', github.repository_owner)) }}

      - name: Verify base image provenance
        shell: bash
        if: startsWith(steps.image_data.outputs.BASE_IMAGE, format('ghcr.io/{0}/', github.repository_owner))
        env:
          BASE_IMAGE_VERSION: ${{ steps.image_data.outputs.BASE_IMAGE_VERSION }}
          BASE_IMAGE: ${{ steps.image_data.outputs.BASE_IMAGE }}
        run: |
          DIGEST=$(crane digest "${BASE_IMAGE}:${BASE_IMAGE_VERSION}")
          slsa-verifier verify-image --source-uri "github.com/${GITHUB_REPOSITORY}" "${BASE_IMAGE}:${BASE_IMAGE_VERSION}@${DIGEST}"
          # remove slsa-verifier so that it can be successfully reinstalled later by bluebuild
          rm -rf ~/.slsa/

      - name: Verify base image signature
        shell: bash
        if: steps.image_data.outputs.IMAGE_NAME != 'securecore-main-hardened' && steps.image_data.outputs.IMAGE_NAME != 'iot-main-hardened'
        env:
          BASE_IMAGE_VERSION: ${{ steps.image_data.outputs.BASE_IMAGE_VERSION }}
          BASE_IMAGE: ${{ steps.image_data.outputs.BASE_IMAGE }}
        run: |
          UPSTREAM_CONTAINER="${BASE_IMAGE}:${BASE_IMAGE_VERSION}"
          if [[ "$BASE_IMAGE" == "ghcr.io/${GITHUB_REPOSITORY_OWNER}/"* ]]; then
            UPSTREAM_PUBKEY='./cosign.pub'
          else
            UPSTREAM_PUBKEY='./files/system/usr/share/pki/containers/quay.io-fedora-ostree-desktops.pub'
          fi
          if ! cosign verify --key "${UPSTREAM_PUBKEY}" "${UPSTREAM_CONTAINER}" | jq; then
            echo "NOTICE: Verification failed. Please ensure your public key is correct."
            exit 1
          fi

      - name: Build secureblue
        uses: blue-build/github-action@836161eb076426a451e6a0054f722b1153b8b3ad # v1.12.0
        env:
          KERNEL_PRIVKEY: ${{ secrets.KERNEL_PRIVKEY }}
        with:
          cli_version: v0.9.37
          recipe: ${{ inputs.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          squash: true
          chunkah: ${{ inputs.rechunk }}
          max_layers: 128
          skip_checkout: true
          use_cache: false
          retry_push_count: 3
          verify_install: true

      - name: Install regctl
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0

      - name: Parse image manifest
        id: image_manifest_metadata
        shell: bash
        env:
          FULL_IMAGE_REF: ${{ steps.image_data.outputs.FULL_IMAGE_REF }}
        run: |
          IMAGE_DIGEST=$(regctl image digest "${FULL_IMAGE_REF}")
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [bluebuild]
    permissions:
      actions: read # for detecting the Github Actions environment.
      id-token: write # for creating OIDC tokens for signing.
      packages: write # for uploading attestations.
    # Currently this must be referenced by tag, not by hash:
    # https://github.com/slsa-framework/slsa-github-generator?tab=readme-ov-file#referencing-slsa-builders-and-generators
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      image: ${{ needs.bluebuild.outputs.FULL_IMAGE_REF }}
      digest: ${{ needs.bluebuild.outputs.IMAGE_DIGEST }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
