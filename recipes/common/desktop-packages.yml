type: dnf
source: ghcr.io/blue-build/modules@sha256:45471c9764ad88e10414ef8580db0a6984508443b0b6463d301d5b13f9092f2e
install:
  install-weak-deps: false
  packages:
    - headsetcontrol
    - mediainfo
    - bubblejail
    - usbguard-notifier
    - usbguard
    - setools
    - fscrypt
    - vim
    - wl-clipboard
    - alsa-firmware
    - fzf
    - bazaar
    - homebrew
    - brew-proxy
    - brew-proxy-selinux
    - firewall-config
    - trivalent-selinux
    - ffmpegthumbnailer

    # yubikey enablement
    - pam-u2f
    - pam_yubico
    - pamu2fcfg
    - yubikey-manager

    # ensure universal font coverage
    - google-noto-fonts-all

    # Virtualization packages
    - qemu-kvm
    - virt-manager
    - virt-viewer

    # ensure MTP support parity
    - libmtp
    - gvfs-mtp

    # ensure adb availability
    - android-tools

remove:
  packages:
    - firefox
    - firefox-langpacks
    - fuse
    - passim
    - fedora-chromium-config
replace:
  - from-repo: copr:copr.fedorainfracloud.org:secureblue:packages
    packages:
      - old: fedora-logos
        new: secureblue-logos
  - from-repo: fedora
    packages:
      - old: OpenCL-ICD-Loader
        new: ocl-icd
