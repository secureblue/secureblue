modules:
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    install:
      install-weak-deps: false
      packages:
        - setools-console
        - usbguard
        - firewalld
        - policycoreutils-python-utils

  - type: files
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    files:
      - source: system/server
        destination: /

  - type: script
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    scripts:
      - excludepcsc.sh
      - setserverdefaultzone.sh
      - disable-coreos-migration-motd.sh
