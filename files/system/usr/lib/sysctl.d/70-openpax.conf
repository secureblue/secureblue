# Enable OpenPaX "soft mode". This means that W^X memory protections are opt-in
# (on a per-executable basis) rather than opt-out. This avoids breaking
# programs that rely on JIT compilation, which includes some desktop
# environment components.
kernel.pax.softmode = 1
