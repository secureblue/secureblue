name: PR Approvals

on:
  pull_request:

jobs:
  pr-approvals:
    name: PR Approvals
    runs-on: ubuntu-latest  
    env:
      approvers:
    steps:
      - uses: secureblue/approvals-action@ba835bbab63f736238918e83b425ded11a1d7623 # v0.0.3
        id: approvers
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          min-required: 2
          approvers: |
            EsseLowNitro
            fiftydinar
            RoyalOughtness
            mintpilo
            mkkvcs
            RKNF404
            Rubiginosa
            ShadowSlayer1441
            spaceoden
            TheHooly
            WavyEbuilder
