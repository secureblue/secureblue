type: systemd
source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89

system:
  disabled:
    - alsa-state.service
    - flatpak-add-fedora-repos.service
    - ModemManager.service
    - bluetooth.service
    - geoclue.service

    # Unconfined rootful services
    - uresourced.service

    - cups.socket
    - cups.service
    - cups-browsed.service

    - sshd.service
    - sshd.socket
    - sshd-keygen.target

    - sssd.service
    - sssd-kcm.service
    - sssd-kcm.socket

    - iscsid.service
    - iscsid.socket
    - iscsiuio.service
    - iscsiuio.socket

    - avahi-daemon.socket
    - avahi-daemon.service

  masked:
    - alsa-state.service
    - flatpak-add-fedora-repos.service
    - ModemManager.service
    - bluetooth.service
    - geoclue.service

    # Unconfined rootful services
    - uresourced.service
    - low-memory-monitor.service
    - thermald.service

    - cups.socket
    - cups.service
    - cups-browsed.service

    - sshd.service
    - sshd.socket
    - sshd-unix-local.socket
    - sshd-keygen.target

    - sssd.service
    - sssd-kcm.service
    - sssd-kcm.socket

    - iscsid.service
    - iscsid.socket
    - iscsiuio.service
    - iscsiuio.socket

    - avahi-daemon.socket
    - avahi-daemon.service

    # Unsandboxed rootful helper service for system flatpak installation
    - flatpak-system-helper.service

user:
  disabled:
    - uresourced.service
  masked:
    - uresourced.service
