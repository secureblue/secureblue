# Shim for oo7-daemon to make it work with secureblue's user namespace
# restrictions. Essentially we use bubblewrap instead of the systemd user
# service manager to apply most sandboxing settings.

[Service]
ExecStart=
ExecStart=/usr/libexec/secureblue/oo7-daemon-sandbox

# Disable settings that would require userns
PrivateDevices=no
PrivateNetwork=no
PrivateTmp=no
PrivateUsers=no
ProtectClock=no
ProtectControlGroups=no
ProtectKernelModules=no
ProtectKernelTunables=no
ProtectSystem=no

# Enable some settings that don't require userns
DevicePolicy=closed
SystemCallFilter=@system-service @mount
SystemCallFilter=~@clock @module @raw-io
SystemCallArchitectures=native
