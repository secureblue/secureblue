[connection]
# RFC 4941 IPv6 privacy extensions: enabled (prefer temporary addresses)
ipv6.ip6-privacy=2

# Disable routed DNS (disabled is the NM default)
# Otherwise, dnsconfd will enable it, which leaks dns queries when a VPN is active
# See dnsconfd:
# https://networkmanager.pages.freedesktop.org/NetworkManager/NetworkManager/NetworkManager.conf.html
ipv4.routed-dns=0
ipv6.routed-dns=0
