modules:
  - type: script
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    scripts:
      - versionlock-qt6.sh
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    remove:
      packages:
        - kde-connect
        - kde-connect-libs
        - kdeconnectd
        - fedora-chromium-config-kde
        - fedora-flathub-remote
        # depends on fedora-flathub-remote
        - plasma-welcome-fedora
        - fuse-encfs
        - krfb
        - krfb-libs
        - plasma-browser-integration
        - plasma-discover
        - plasma-discover-libs
        - fedora-workstation-repositories
        - fedora-third-party
        # require unconfined userns
        - kaccounts-providers
        - kio-gdrive
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    install:
      install-weak-deps: false
      packages:
        - krunner-bazaar
  - type: files
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    files:
      - source: system/kinoite
        destination: /
  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    validate: true
    include:
      - kinoite.just
  - type: script
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    scripts:
      - setdefaultkdewallpapers.sh
      - plasma-apps-standard-malloc.sh
      - removekrunnerappstream.sh
