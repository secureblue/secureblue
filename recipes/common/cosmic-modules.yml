modules:
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    install:
      install-weak-deps: false
      packages:
        - NetworkManager-tui
        - NetworkManager-openvpn
    remove:
      packages:
        - cosmic-store
        - cosmic-player
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
  - type: systemd
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    system:
      enabled:
        - cosmic-greeter
  - type: files
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    files:
      - source: system/cosmic
        destination: /
