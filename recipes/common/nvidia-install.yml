modules:
  - type: files
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    files:
      - source: system/nvidia
        destination: /

  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    validate: true
    include:
      - nvidia

  - type: script
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    scripts:
      - installnvidiakmod.sh
    secrets:
      - type: env
        name: KERNEL_PRIVKEY
        mount:
          type: file
          destination: /tmp/certs/private_key.priv

  - type: script
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    scripts:
      - installnvidiapackages.sh
      - remove-nvidia-repos.sh
      - setearlyloading.sh
      - setdrmvariables.sh
      - setdistroboxnvidiatrue.sh
