name: verify-provenance
permissions: {}
on:
  schedule:
    - cron: "00 15 * * *" # run at 15:00 UTC every day

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-provenance:
    name: Verify provenance
    if: github.triggering_actor == 'royaloughtness' || github.event_name == 'schedule'
    runs-on: ubuntu-slim
    permissions:
      packages: read # needed to pull images
    steps:
      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          # renovate: datasource=github-releases depName=oras-project/oras
          version: 1.3.6

      - name: Install slsa-verifier
        uses: slsa-framework/actions/install/verifier@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
        with:
          # renovate: datasource=github-releases depName=slsa-framework/verifier
          version: v0.1.1

      - name: Verify provenance
        shell: bash
        run: |
          set -euo pipefail
          images=(
            silverblue-main-hardened
            silverblue-nvidia-hardened
            silverblue-nvidia-open-hardened
            kinoite-main-hardened
            kinoite-nvidia-hardened
            kinoite-nvidia-open-hardened
            sericea-main-hardened
            sericea-nvidia-hardened
            sericea-nvidia-open-hardened
            cosmic-main-hardened
            cosmic-nvidia-hardened
            cosmic-nvidia-open-hardened
            iot-main-hardened
            iot-nvidia-hardened
            iot-nvidia-open-hardened
            securecore-main-hardened
            securecore-nvidia-hardened
            securecore-nvidia-open-hardened
          )

          verify_provenance() {
            local image_ref="$1"
            local tag="$2"
            local tempdir
            tempdir=$(mktemp -d)
            trap 'rm -rf "${tempdir}"' RETURN

            local referrers
            referrers=$(
              oras discover --format json \
                --artifact-type 'application/vnd.in-toto.provenance+dsse' \
                "${image_ref}:${tag}"
            ) || return 1

            local digest
            digest=$(jq -er '.digest' <<<"${referrers}") || return 1

            local provenance_digest
            provenance_digest=$(jq -er '.referrers[].digest' <<<"${referrers}") || return 1
            if [[ -z "${provenance_digest}" ]]; then
              echo "Provenance not found for ${image_ref}@${digest}"
              return 1
            elif [[ "${provenance_digest}" == *$'\n'* ]]; then
              echo "More than one provenance artifact found for ${image_ref}@${digest}"
              return 1
            fi

            # Confirm that provenance can also be pulled by tag
            local prov_by_tag="${image_ref}:${digest/:/-}-provenance"
            local prov_tag_digest
            prov_tag_digest=$(oras resolve "${prov_by_tag}") \
              || { echo "Unable to resolve provenance by tag: ${prov_by_tag}"; return 1; }
            if [[ "${prov_tag_digest}" != "${provenance_digest}" ]]; then
              echo "Provenance digest mismatch for ${prov_by_tag}"
              return 1
            fi

            echo "Verifying provenance for ${image_ref}@${digest}..."
            oras pull -o "${tempdir}" "${image_ref}@${provenance_digest}" || return 1
            slsa-verifier build "${tempdir}/provenance.intoto.json" \
              --level 3 \
              --require-signatures \
              --signer 'sigstore(identityMatch=regex)::https://token.actions.githubusercontent.com::https://github\.com/slsa-framework/actions/\.github/workflows/attest_actions\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+' \
              --subject "${digest}" \
              --param 'expected_source:github.com/secureblue/secureblue' \
              --param 'expected_branch:live' \
              --param 'trusted_builders:[https://github.com/secureblue/secureblue/.github/workflows/build-all.yml@refs/heads/live]'
          }

          failed_images=()
          for image_name in "${images[@]}"; do
            image_ref="ghcr.io/secureblue/${image_name}"
            for tag in latest uki; do
              if [[ "${tag}" == uki && "${image_name}" =~ -nvidia- ]]; then
                continue
              fi
              if ! verify_provenance "${image_ref}" "${tag}"; then
                failed_images+=("${image_name}:${tag}")
                echo "FAIL: Provenance verification failed for ${image_name}:${tag}"
              fi
              echo
            done
          done
          if [[ "${#failed_images[@]}" -gt 0 ]]; then
            echo "FAIL: the following images failed provenance verification: ${failed_images[*]}"
            exit 1
          fi
