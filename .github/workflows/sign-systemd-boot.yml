name: "Sign systemd-boot"

permissions: {}

env:
  FEDORA_RELEASE: "45"

on:
  # This only needs rebuilding for new releases of systemd-boot, e.g. after
  # every Fedora release, or if the signing key changes. Swapping it might
  # change the TPM PCR values, which would prompt some users for PINs etc.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uki-sign-systemd-boot:
    name: "Build and UKI-sign systemd boot"
    runs-on: "ubuntu-26.04"
    environment: UKIBuild
    if: github.triggering_actor == 'royaloughtness'
    permissions:
      contents: read # Needed to pull the repo for the build
      packages: write # Needed to publish images
    outputs:
      IMAGE_DIGEST: ${{ steps.push.outputs.digest }}
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Runner setup"
        uses: $/.github/workflows/shared-runner-setup

      - name: "Log in to registry"
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: "ghcr.io/${{ github.repository_owner }}"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Get secure boot signing key"
        run: |
          mkdir -p /tmp/keys
          printenv UKI_DB_KEY > /tmp/keys/key
          cp uki/keys/db/db.pem /tmp/keys/crt
        env:
          UKI_DB_KEY: ${{ secrets.UKI_DB_KEY }}

      - name: "Build container image"
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: "systemd-boot"
          tags: "latest ${{ env.FEDORA_RELEASE }}"
          containerfiles: "uki/Containerfile.systemd-boot"
          oci: true
          build-args: |
            RELEASE=${{ env.FEDORA_RELEASE }}
          extra-args: |
            --secret=id=secureboot_key,src=/tmp/keys/key
            --secret=id=secureboot_crt,src=/tmp/keys/crt

      - name: "Clean up secure boot signing key"
        if: always()
        run: rm -vrf /tmp/keys

      - name: "Push to registry"
        id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          registry: "ghcr.io/${{ github.repository_owner }}"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          image: "systemd-boot"
          tags: "latest ${{ env.FEDORA_RELEASE }}"

  cosign-systemd-boot:
    needs: uki-sign-systemd-boot
    name: "Cosign systemd boot"
    environment: Build
    runs-on: "ubuntu-26.04"
    permissions:
      contents: read # Needed to pull the repo for the build
      packages: write # Needed to sign images
    steps:
      - name: "Check out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Set up runner"
        uses: $/.github/workflows/shared-runner-setup
        with:
          needs_cosign: true

      - name: "Log in to registry"
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: "ghcr.io/${{ github.repository_owner }}"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Sign container image"
        run: |
          cosign sign -y --key env://COSIGN_KEY ghcr.io/${GITHUB_REPOSITORY_OWNER}/systemd-boot@${DIGEST}
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ needs.uki-sign-systemd-boot.outputs.IMAGE_DIGEST }}

  # Generate SLSA v1 level 3 build provenance attestation
  provenance:
    needs: uki-sign-systemd-boot
    permissions:
      actions: read # to detect the Github Actions environment
      contents: read
      id-token: write # to create OIDC tokens for signing
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@v0.2.0 # zizmor: ignore[unpinned-uses]
    with:
      build-from-source: false
      # renovate: datasource=github-releases depName=slsa-framework/attester
      version: v0.1.1
      watch-jobs: uki-sign-systemd-boot
      collect-artifacts: false
      subjects: ${{ needs.uki-sign-systemd-boot.outputs.IMAGE_DIGEST }}
      artifact-name: slsa-provenance

  push-attestation:
    needs: [uki-sign-systemd-boot, provenance]
    permissions:
      packages: write # to push attestation to GHCR
    uses: $/.github/workflows/push-provenance.yml
    with:
      artifact-name: slsa-provenance
      image-ref: "ghcr.io/${{ github.repository_owner }}/systemd-boot:latest"
      digest: ${{ needs.uki-sign-systemd-boot.outputs.IMAGE_DIGEST }}
