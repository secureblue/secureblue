[Service]
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/var/lib/flatpak
# 'ExecCondition' requires access to /run/dbus
InaccessiblePaths=/run/user
NoNewPrivileges=true
PrivateUsers=full
PrivateDevices=true
PrivateTmp=disconnected
ProtectClock=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectHostname=private
ProtectProc=invisible
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native
CapabilityBoundingSet=
SystemCallFilter=~@privileged @debug @mount @swap @obsolete @raw-io
SystemCallFilter=~@cpu-emulation @reboot @resources @module @clock
RestrictNamespaces=~user pid net uts mnt cgroup ipc
RestrictAddressFamilies=AF_PACKET AF_NETLINK AF_BLUETOOTH
