repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md,patch"]
        exclude: "\\.patch$"

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f # v1.31.1
    hooks:
      - id: zizmor
        exclude: "^\\.github/workflows/config/linkspector\\.yml$"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: 18b2b8bb1b9b90d2d21283756e89b07fc9c747bf # v0.0.95
    hooks:
      - id: ty
        args: [--isolated]

  - repo: local
    hooks:
      # We use a local hook rather than the official ShellCheck pre-commit hook
      # because the official hook runs as a container image, which won't run on
      # secureblue in the default system configuration.
      - id: shellcheck
        name: ShellCheck
        description: "Shell script linter: https://www.shellcheck.net/"
        entry: shellcheck
        language: system
        types: [text]
        types_or: [bash, bats, shell]

      - id: shell-script-shebangs
        name: check script shebangs
        description: "Check shell script shebang lines are normalized"
        entry: awk -f tools/check-shell-script-shebangs.awk
        language: system
        types: [text]
        types_or: [bash, bats, shell]

      - id: sync-runner-endpoints
        name: Sync runner endpoints
        description: "Sync runner allowed endpoints for step-security/harden-runner"
        entry: tools/sync_runner_allowed_endpoints.py
        language: system
        files: "\\.github/workflows/.*\\.(txt|ya?ml)$"
