modules:
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    remove:
      packages:
        - kde-connect
        - kde-connect-libs
        - kdeconnectd
        - fedora-chromium-config-kde
        - fedora-flathub-remote
        - fuse-encfs
        - krfb
        - krfb-libs
        - plasma-browser-integration
        - plasma-discover-rpm-ostree

        # depends on fedora-flathub-remote
        - plasma-welcome-fedora
  - type: files
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    files:
      - source: system/kinoite
        destination: /
  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    validate: true
    include:
      - kinoite.just
  - type: script
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    scripts:
      - setdefaultkdewallpapers.sh
      - systemsettings-standard-malloc.sh
