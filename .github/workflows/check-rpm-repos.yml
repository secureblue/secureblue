name: RPM GPG key check

permissions: {}

on:
  pull_request:
    paths:
      - "**.repo"
      - "**/rpm-gpg/*"
      - "files/scripts/**"
      - "tools/**"
  schedule:
    - cron: "00 3 * * *" # run at 3:00 UTC every day
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rpm-gpg:
    name: Check RPM repo consistency
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check RPM repo keys
        run: tools/check_repo_keys.py
