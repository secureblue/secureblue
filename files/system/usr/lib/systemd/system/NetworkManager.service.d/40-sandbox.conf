[Service]
CapabilityBoundingSet=~CAP_DAC_OVERRIDE CAP_SETGID CAP_SETUID CAP_KILL
CapabilityBoundingSet=~CAP_SYS_MODULE CAP_AUDIT_WRITE CAP_SYS_CHROOT CAP_BPF
DevicePolicy=closed
# NM requires access to /run/dbus/
InaccessiblePaths=/run/user/
LockPersonality=true
MemoryDenyWriteExecute=true
PrivateDevices=true
PrivateTmp=disconnected
ProtectClock=true
ProtectControlGroups=true
ProtectHome=true
ProtectHostname=private
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectProc=invisible
ProtectSystem=strict
ReadWritePaths=/proc/sys/net/ /var/lib/NetworkManager/ /etc/NetworkManager/
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_PACKET
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
SystemCallArchitectures=native
SystemCallFilter=@system-service @privileged
SystemCallFilter=~@clock @module @mount @obsolete @swap @reboot @raw-io @module
SystemCallFilter=~@resources @memlock @aio @keyring
UMask=077
