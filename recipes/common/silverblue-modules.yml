modules:
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    install:
      install-weak-deps: false
      packages:
        - gnome-disk-utility
        - adw-gtk3-theme
        - gnome-tweaks
    remove:
      packages:
        - gnome-shell-extension-background-logo
        - gnome-tour
        - yelp
        - gnome-user-share
        - mod_lua
        - httpd
        - httpd-core
        - mod_http2
        - mod_dnssd
        - gnome-remote-desktop
        - libvncserver
        - fedora-chromium-config-gnome
        - gnome-software
        - epiphany-runtime
        - totem-video-thumbnailer
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
  - type: gschema-overrides
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    include:
      - zz1-secureblue.gschema.override
  - type: script
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    scripts:
      - removedkmshelper.sh
  - type: files
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    files:
      - source: system/silverblue
        destination: /
  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    validate: true
    include:
      - silverblue.just
