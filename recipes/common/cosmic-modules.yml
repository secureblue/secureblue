modules:
    - type: dnf
      source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
      install:
        install-weak-deps: false
        packages:
          - NetworkManager-tui
          - NetworkManager-openvpn
          - cosmic-store
          - cosmic-player
      remove:
        packages:
          - fedora-flathub-remote
          - fedora-third-party
          - fedora-workstation-repositories
    - type: systemd
      source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
      system:
        enabled:
          - cosmic-greeter