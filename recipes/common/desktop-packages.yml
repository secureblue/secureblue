type: dnf
repos:
  copr:
    - secureblue/bubblejail
    - secureblue/branding
  files:
    - https://repo.secureblue.dev/secureblue.repo
install:
  install-weak-deps: false
  packages:
    - headsetcontrol
    - trivalent
    - secureblue-logos
    - mediainfo
    - bubblejail
    - usbguard-notifier
    - usbguard
    - setools
    - fscrypt
    - vim
    - wl-clipboard
    - alsa-firmware
    
    # yubikey enablement
    - pam-u2f
    - pam_yubico
    - pamu2fcfg
    - yubikey-manager

    # ensure universal font coverage
    - google-noto-fonts-all
remove:
  packages:
    - fedora-logos
    - firefox
    - firefox-langpacks
    - fuse
    - passim
    - fedora-chromium-config




