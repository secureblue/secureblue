modules:
  - type: script
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    scripts:
      - versionlock-qt6.sh
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    remove:
      packages:
        - kde-connect
        - kde-connect-libs
        - kdeconnectd
        - fedora-chromium-config-kde
        - fedora-flathub-remote
        # depends on fedora-flathub-remote
        - plasma-welcome-fedora
        - fuse-encfs
        - krfb
        - krfb-libs
        - plasma-browser-integration
        - plasma-discover
        - plasma-discover-libs
        - fedora-workstation-repositories
        - fedora-third-party
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    install:
      install-weak-deps: false
      packages:
        - krunner-bazaar
  - type: files
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    files:
      - source: system/kinoite
        destination: /
  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    validate: true
    include:
      - kinoite.just
  - type: script
    source: ghcr.io/blue-build/modules@sha256:f1273b17987eed439b0feff77bf4b7f1c734e6f77607dc99c9de9d9070555c7a
    scripts:
      - setdefaultkdewallpapers.sh
      - systemsettings-standard-malloc.sh
      - removekrunnerappstream.sh
