modules:
    - type: dnf
      repos:
        files:
          - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      install:
        install-weak-deps: false
        packages:
          - setools-console
          - usbguard
          - firewalld
          - policycoreutils-python-utils
      remove:
        packages:
          - sudo
    - type: files
      files:
        - source: system/server
          destination: /
    - type: script
      scripts:
        - excludepcsc.sh
        - setserverdefaultzone.sh
        - setservermotd.sh
        - removebrewjust.sh
        - removesuid.sh
