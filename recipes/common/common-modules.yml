modules:
  - type: script
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    scripts:
      - removeunusedrepos.sh
      - httpsmirrors.sh
      - unprotectsudo.sh
      - check-bad-package-versions.sh
      # comment/uncomment the line below to disable/enable kernel pinning
      # - installpinnedkernel.sh

  - type: files
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    files:
      - source: system/usr
        destination: /usr
      - source: system/etc
        destination: /etc

  - from-file: common/common-packages.yml

  - from-file: common/common-systemd.yml

  - from-file: common/common-scripts.yml

  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    validate: true
    include:
      - common

  - type: script
    source: ghcr.io/blue-build/modules@sha256:5087b21811f9dcb28c750a64459dced3e241e3e94ec9a3793613ea3b88474c89
    scripts:
      - installkernel.sh

  - type: secureblue-signing
    source: local
