name: Automod

on:
  issue_comment:
    types: [created, edited]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comment-filter:
    name: Comment filter
    runs-on: ubuntu-slim
    permissions:
      issues: write # delete spam
    steps:
      - name: Comment filter
        uses: DecimalTurn/Comment-Filter@8ddca60fc5cd00e942836e49fe4eaab70cb6f075 # v0.2.3
        with:
          exclude-contributors: true
