modules:
    - type: dnf
      install:
        install-weak-deps: false
        packages:
          - NetworkManager-tui
          - NetworkManager-openvpn
          - cosmic-store
          - cosmic-player
      remove:
        packages:
          - fedora-flathub-remote
          - fedora-third-party
          - fedora-workstation-repositories
    - type: systemd
      system:
        enabled:
          - cosmic-greeter