modules:
  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    validate: true
    include:
      - nvidia
  - type: script
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    scripts:
      - installnvidiakmod.sh
    secrets:
      - type: env
        name: KERNEL_PRIVKEY
        mount:
          type: file
          destination: /tmp/certs/private_key.priv
  - type: script
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    scripts:
      - installnvidiapackages.sh
      - removeunusedrepos.sh
      - setearlyloading.sh
      - setdrmvariables.sh
  - type: files
    source: ghcr.io/blue-build/modules@sha256:4eeed12ff342da5493b1cca51285cba4179f8e21a609798facc55769080e9243
    files:
      - source: system/nvidia
        destination: /
