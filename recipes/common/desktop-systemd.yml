    - alsa-state.service
    - ModemManager.service
    - bluetooth.service

    # Unconfined rootful services
    - uresourced.service
    - low-memory-monitor.service
    - thermald.service

    - cups.socket
    - cups.service
    - cups-browsed.service

    - sshd.service
    - sshd.socket
    - sshd-unix-local.socket
    - sshd-keygen.target

    - sssd.service
