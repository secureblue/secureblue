type: systemd
source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94

system:
  disabled:
    - systemd-resolved.service

    - rpm-ostree-countme.timer
    - rpm-ostree-countme.service

    # We intentionally don't mask the services, because
    # some users may want to use it. But we disable it by default
    # to reduce attack surface, since we don't use it by default.
    - systemd-homed-activate.service
    - systemd-homed-firstboot.service
    - systemd-homed.service

  masked:
    - systemd-resolved.service

    - rpm-ostree-countme.timer
    - rpm-ostree-countme.service

    # For more info, see https://blog.nsrun.io/2026/01/15/systemd-vsock-openssh-server/
    - sshd-vsock.socket

    # NFS daemons
    - gssproxy.service
    - nfs-blkmap.service
    - nfs-client.target
    - nfs-idmapd.service
    - nfs-mountd.service
    - nfs-server.service
    - nfs-utils.service
    - nfsdcld.service
    - rpc-gssd.service
    - rpc-statd-notify.service
    - rpc-statd.service
    - rpc_pipefs.target
    - rpcbind.service
    - rpcbind.socket
    - rpcbind.target
    - var-lib-nfs-rpc_pipefs.mount
