name: Python linters
permissions: {}
on:
  pull_request:
    paths:
      - "**.py"
      - "pyproject.toml"
      - ".github/workflows/python-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  linters:
    name: Python linters
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          tmpfile=$(mktemp)
          cat <<'EOF' > "${tmpfile}"
          pip==26.2.2 \
            --hash=sha256:fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70

          blessed==1.50.0 \
            --hash=sha256:6a693d524f7c21129dd61c4d10f11bda89911c05dc7df91219854c9ccf394cbf
          editor==2.0.1 \
            --hash=sha256:96277ffb0c529d9b54f0c10bff4bd39d23ab1298504424232319b1a26b41240a
          inquirer==3.4.1 \
            --hash=sha256:717bf146d547b595d2495e7285fd55545cff85e5ce01decc7487d2ec6a605412
          jinxed==2.1.0 \
            --hash=sha256:43b802d18b70e405d410fb66eb2837d1101e7e5ea922e666507bb43f34d11d09
          readchar==4.2.2 \
            --hash=sha256:92daf7e42c52b0787e6c75d01ecfb9a94f4ceff3764958b570c1dddedd47b200
          rpm==0.5.0 \
            --hash=sha256:cd59bce89060c914d1eacac0ebf194a99ba5c14d16cfa3bed35b59b84da0e368
          ruff==0.17.1 \
            --hash=sha256:a6ef98e51de8ef38082f90653ceeb84944bd7673783eea13e1647c5b9b064189
          runs==1.3.0 \
            --hash=sha256:e71a551cfa8da9ef882cac1d5a108bda78c9edee5b8d87e37c1003da5b6a7bed
          ty==0.0.89 \
            --hash=sha256:95a410f10b26cc3861757b626727db9d979deba7d2a3ab59f964fac8f0514fdc
          wcwidth==0.9.2 \
            --hash=sha256:751bef0ab404b6a1dc028b56b4b85d46486be1c55833f80da533e42dc691f389
          xmod==1.10.0 \
            --hash=sha256:bebf8493b7ac63097401590a329c9ed20da224de0583a522e7ccb634af122f5a
          EOF

          python -m pip install --require-hashes -r "${tmpfile}"

      - name: Run Ruff (linter)
        run: ruff check --output-format=github

      - name: Check code formatting
        run: ruff format --diff

      - name: Run Ty (type-checker)
        run: ty check --output-format=github
