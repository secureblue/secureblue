modules:
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:45471c9764ad88e10414ef8580db0a6984508443b0b6463d301d5b13f9092f2e
    install:
      install-weak-deps: false
      packages:
        - NetworkManager-tui
        - NetworkManager-openvpn
    remove:
      packages:
        - cosmic-store
        - cosmic-player
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
  - type: systemd
    source: ghcr.io/blue-build/modules@sha256:45471c9764ad88e10414ef8580db0a6984508443b0b6463d301d5b13f9092f2e
    system:
      enabled:
        - cosmic-greeter
  - type: files
    source: ghcr.io/blue-build/modules@sha256:45471c9764ad88e10414ef8580db0a6984508443b0b6463d301d5b13f9092f2e
    files:
      - source: system/cosmic
        destination: /
