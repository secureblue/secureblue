modules:
  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:3d53ecab54b72f4853b02bb7b4f666cc704a32da8733420103dc154ba824ea9b
    install:
      install-weak-deps: false
      packages:
        - setools-console
        - usbguard
        - firewalld
        - policycoreutils-python-utils

  - type: files
    source: ghcr.io/blue-build/modules@sha256:3d53ecab54b72f4853b02bb7b4f666cc704a32da8733420103dc154ba824ea9b
    files:
      - source: system/server
        destination: /

  - type: script
    source: ghcr.io/blue-build/modules@sha256:3d53ecab54b72f4853b02bb7b4f666cc704a32da8733420103dc154ba824ea9b
    scripts:
      - excludepcsc.sh
      - setserverdefaultzone.sh
      - disable-coreos-migration-motd.sh
      - remove-dns-greenboot-check.sh
