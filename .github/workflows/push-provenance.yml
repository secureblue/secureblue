name: push-provenance
permissions: {}
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        required: true
      image-ref:
        type: string
        required: true
      digest:
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.image-ref }}
  cancel-in-progress: true

jobs:
  push-attestation:
    name: Push provenance attestation
    runs-on: ubuntu-26.04
    permissions:
      packages: write # to push attestation to GHCR
    steps:
      - name: Install oras
        uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          # renovate: datasource=github-releases depName=oras-project/oras
          version: 1.3.6

      - name: Get registry info
        id: registry-info
        shell: bash
        env:
          FULL_IMAGE_REF: ${{ inputs.image-ref }}
        run: |
          registry="${FULL_IMAGE_REF%%/*}"
          registry_username="${FULL_IMAGE_REF#*/}"
          registry_username="${registry_username%%/*}"
          echo "REGISTRY=${registry}" >>"${GITHUB_OUTPUT}"
          echo "REGISTRY_USERNAME=${registry_username}" >>"${GITHUB_OUTPUT}"

      - name: Log in to registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ${{ steps.registry-info.outputs.REGISTRY }}
          username: ${{ steps.registry-info.outputs.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download SLSA attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}

      - name: Push attestation
        shell: bash
        env:
          FULL_IMAGE_REF: ${{ inputs.image-ref }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: |
          artifact_ref="${FULL_IMAGE_REF%:*}:${IMAGE_DIGEST/:/-}-provenance"
          oras push "${artifact_ref}" provenance.intoto.json:application/vnd.dsse.envelope.v1+json
