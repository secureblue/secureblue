[Service]
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=/var/lib/flatpak
InaccessiblePaths=/run/user

NoNewPrivileges=true
PrivateUsers=full
PrivateDevices=true
PrivateTmp=disconnected
ProtectClock=true
ProtectControlGroups=true
ProtectKernelLogs=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectHostname=private
ProtectProc=invisible
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
MemoryDenyWriteExecute=true
SystemCallArchitectures=native

CapabilityBoundingSet=~CAP_AUDIT_CONTROL CAP_AUDIT_READ CAP_AUDIT_WRITE
CapabilityBoundingSet=~CAP_BLOCK_SUSPEND CAP_KILL CAP_LEASE CAP_LINUX_IMMUTABLE
CapabilityBoundingSet=~CAP_MAC_ADMIN CAP_MAC_OVERRIDE CAP_MKNOD CAP_SYS_ADMIN
CapabilityBoundingSet=~CAP_SYS_BOOT CAP_SYS_CHROOT CAP_SYS_MODULE CAP_SYS_PACCT
CapabilityBoundingSet=~CAP_SYS_PTRACE CAP_SYS_RAWIO CAP_SYS_TTY_CONFIG CAP_WAKE_ALARM
CapabilityBoundingSet=~CAP_NET_ADMIN CAP_SYS_NICE CAP_SYS_RESOURCE CAP_IPC_LOCK
CapabilityBoundingSet=~CAP_NET_BIND_SERVICE CAP_NET_BROADCAST CAP_NET_RAW
CapabilityBoundingSet=~CAP_CHOWN CAP_FSETID CAP_SETFCAP CAP_SYS_TIME CAP_SYSLOG
CapabilityBoundingSet=~CAP_DAC_OVERRIDE CAP_DAC_READ_SEARCH CAP_FOWNER CAP_IPC_OWNER
CapabilityBoundingSet=~CAP_SETUID CAP_SETGID CAP_SETPCAP CAP_BPF
SystemCallFilter=~@privileged @debug @mount @swap @obsolete @raw-io
SystemCallFilter=~@cpu-emulation @reboot @resources @module @clock
RestrictNamespaces=~user pid net uts mnt cgroup ipc
RestrictAddressFamilies=AF_PACKET AF_NETLINK AF_BLUETOOTH
