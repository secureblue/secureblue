modules:
  - type: script
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    scripts:
      - removeunusedrepos.sh
      - httpsmirrors.sh
      - unprotectsudo.sh
      - check-bad-package-versions.sh
      # comment/uncomment the line below to disable/enable kernel pinning
      # - installpinnedkernel.sh

  - type: files
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    files:
      - source: system/usr
        destination: /usr
      - source: system/etc
        destination: /etc

  - from-file: common/common-packages.yml

  - from-file: common/common-systemd.yml

  - from-file: common/common-scripts.yml

  - type: justfiles
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    validate: true
    include:
      - common

  - type: script
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    scripts:
      - installkernel.sh

  - type: secureblue-signing
    source: local
